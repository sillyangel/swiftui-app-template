name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    outputs:
      PR_NUMBER: ${{ steps.pr_version.outputs.PR_NUMBER }}
      VERSION: ${{ steps.pr_version.outputs.VERSION }}
      BUILD_VERSION: ${{ steps.pr_version.outputs.BUILD_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Calculate PR version
        id: pr_version
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          PR="$PR_NUMBER"
          # Simple version: 0.0.0-pr<PR>.v<run_number>
          VERSION="0.0.0-pr${PR}.v${{ github.run_number }}"
          BUILD_VERSION=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "PR_NUMBER=$PR" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "PR version: $VERSION (build $BUILD_VERSION) for PR #$PR"

      - name: Build archive
        run: |
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HelloWorld.xcarchive \
            MARKETING_VERSION="${{ steps.pr_version.outputs.VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ steps.pr_version.outputs.BUILD_VERSION }}" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/HelloWorld.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r HelloWorld.ipa Payload
          ls -lh HelloWorld.ipa

      - name: Upload PR IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: pr-${{ steps.pr_version.outputs.PR_NUMBER }}-ipa-${{ steps.pr_version.outputs.VERSION }}
          path: build/HelloWorld.ipa
          if-no-files-found: error